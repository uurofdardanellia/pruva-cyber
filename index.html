<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Step-by-step cyber emergency guide for seafarers">
<title>Pruva Cyber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: bridge-console shell — slim dark navigation rail with icons, a quiet sticky top bar, and a calm working canvas of soft white surfaces; collapses to a top tab strip on phones. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --panel-2:#f8fafb; --ink:#111c26; --muted:#5f6c78; --faint:#8b97a2; --line:#e3e8ec; --soft:#edf1f4;
  --accent:#d9541a; --accent-soft:#fdeee6; --accent-ink:#ffffff; --navy:#0f2233; --navy-2:#173149; --navy-ink:#dfe8ef;
  --ok:#1b7a4b; --ok-bg:#e3f3ea; --warn:#9a6400; --warn-bg:#fcf1d9; --bad:#b4271f; --bad-bg:#fce6e4; --info:#1d5f8c; --info-bg:#e2eef7;
  --shadow:0 1px 2px rgba(15,34,51,.05),0 4px 14px rgba(15,34,51,.05);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c141b; --panel:#131d26; --panel-2:#17222c; --ink:#e4eaef; --muted:#9aa7b2; --faint:#6f7d89; --line:#24323e; --soft:#1b2732;
  --accent:#f07b45; --accent-soft:#3a2014; --accent-ink:#1a0c05; --navy:#080f15; --navy-2:#121e29; --navy-ink:#d4dee6;
  --ok:#5ccb90; --ok-bg:#15301f; --warn:#e5b24d; --warn-bg:#33270f; --bad:#f2857e; --bad-bg:#3b1815; --info:#7cb9e4; --info-bg:#122b3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141b; --panel:#131d26; --panel-2:#17222c; --ink:#e4eaef; --muted:#9aa7b2; --faint:#6f7d89; --line:#24323e; --soft:#1b2732;
  --accent:#f07b45; --accent-soft:#3a2014; --accent-ink:#1a0c05; --navy:#080f15; --navy-2:#121e29; --navy-ink:#d4dee6;
  --ok:#5ccb90; --ok-bg:#15301f; --warn:#e5b24d; --warn-bg:#33270f; --bad:#f2857e; --bad-bg:#3b1815; --info:#7cb9e4; --info-bg:#122b3d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:2rem} h2{font-size:1.32rem} h3{font-size:1.06rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .7rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
a{color:var(--info)}
.muted{color:var(--muted)}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{background:var(--navy);color:var(--navy-ink);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--navy-2);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.brand b{font:700 1.2rem/1 var(--f-display);letter-spacing:.06em;display:block}
.brand small{display:block;font:500 .66rem/1.3 var(--f-mono);opacity:.55;margin-top:4px}
.nav-label{font:600 .64rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.45;padding:0 10px;margin-bottom:-14px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--navy-ink);text-decoration:none;font-weight:500;font-size:.9rem;opacity:.72}
nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{opacity:1;background:rgba(255,255,255,.05)}
nav a[aria-current="page"]{opacity:1;background:var(--navy-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
nav a[aria-current="page"] svg{stroke:var(--accent)}
nav a .badge{margin-left:auto;font:600 .68rem var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;padding:12px;border-radius:10px;background:var(--navy-2);font-size:.78rem;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.rail-foot b{font-weight:600}
.conn{display:flex;align-items:center;gap:7px;font:.74rem/1.3 var(--f-mono);opacity:.8}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.live{background:#4fc58a;box-shadow:0 0 0 3px rgba(79,197,138,.18)}
.dot.local{background:#e5b24d}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding-block:12px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px));max-width:1260px}
.crumb{font-size:.84rem;color:var(--muted)} .crumb b{color:var(--ink);font-weight:600}
.top-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock-utc{font:500 .8rem var(--f-mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
main{min-width:0}
.main-in{padding-block:28px 72px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:20px;max-width:1196px}

/* Page head */
.head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:4px}
.head h1{margin-top:6px}
.head p{margin:8px 0 0;color:var(--muted);max-width:72ch;font-size:.93rem}

/* Surfaces */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.kpi b{font:600 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.alert b{color:var(--bad)}

/* Controls */
.btn{font:600 .85rem var(--f-body);border-radius:var(--r-sm);padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{background:var(--panel-2);border-color:color-mix(in srgb,var(--muted) 40%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(217,84,26,.25)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:6px 11px;font-size:.79rem}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:400 .9rem var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--muted) 35%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:18px;height:18px;min-width:18px;padding:0;border:1.5px solid color-mix(in srgb,var(--muted) 60%,var(--line));border-radius:5px;background:var(--panel);cursor:pointer;display:inline-grid;place-content:center;margin:2px 0 0}
input[type="checkbox"]::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
input[type="checkbox"]:checked::after{opacity:1}
textarea{resize:vertical;min-height:78px}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.form .wide{grid-column:1/-1}
.form .eyebrow.wide{padding-top:10px;border-top:1px solid var(--line);margin-top:4px}
.form .eyebrow.wide:first-child{border-top:0;padding-top:0;margin-top:0}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:.88rem;color:var(--ink);font-weight:400;cursor:pointer}
.chk input{width:18px}

/* Badges */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 .7rem/1 var(--f-body);padding:5px 8px;border-radius:6px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.ot{background:var(--navy-2);color:var(--navy-ink)}
.pill.ph-det{background:var(--info-bg);color:var(--info)}.pill.ph-con{background:var(--accent-soft);color:var(--accent)}.pill.ph-rec{background:var(--bad-bg);color:var(--bad)}.pill.ph-rep{background:var(--warn-bg);color:var(--warn)}.pill.ph-prep{background:var(--ok-bg);color:var(--ok)}.pill.ph-post{background:var(--soft);color:var(--muted)}
.ref{font:500 .7rem var(--f-mono);color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:2px 6px;border-radius:5px;white-space:nowrap}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow)}
.panel .tw{box-shadow:none}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .68rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);background:var(--panel-2)}
tbody tr:hover td{background:var(--panel-2)}
tr:last-child td{border-bottom:0}
.eq-row td:first-child{font-weight:600}

/* Ship cards */
.ship-card{display:flex;flex-direction:column;gap:16px}
.ship-card .top-line{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ship-card .id{display:flex;gap:14px;align-items:center;min-width:0}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 1.02rem var(--f-display)}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini{background:var(--panel-2);border-radius:var(--r-sm);padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini b{font:600 1.12rem var(--f-display);font-variant-numeric:tabular-nums}
.mini span{font-size:.7rem;color:var(--muted);line-height:1.25}
.meter{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%;border-radius:99px}
.stat{display:flex;gap:22px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font:600 1.35rem var(--f-display)}
.stat span{font-size:.74rem;color:var(--muted)}

/* Playbook */
.phase{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.phase-h{display:flex;gap:12px;align-items:center;padding:13px 16px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.phase-h .ix{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 .82rem var(--f-mono);color:#fff;flex:none}
.p-prep .ix{background:#5f8a3a}.p-det .ix{background:#1d5f8c}.p-con .ix{background:var(--accent)}.p-rec .ix{background:#b4271f}.p-rep .ix{background:#9a6400}.p-post .ix{background:#5f6c78}
.phase-h .cnt{margin-left:auto;font:500 .75rem var(--f-mono);color:var(--muted)}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step:hover{background:var(--panel-2)}
.step.done p{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.step p{margin:0;font-size:.92rem}
.step p label{cursor:pointer}
.step .meta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.progress{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:120px;flex:1}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.notice{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--r-sm);padding:12px 14px;font-size:.87rem}
.notice.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.empty{padding:36px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);background:var(--panel)}
.clock{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.clock .c{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.clock .c.bad{border-color:var(--bad);background:linear-gradient(var(--bad),var(--bad)) top/100% 3px no-repeat,var(--panel)} .clock .c.done{border-color:var(--ok);background:linear-gradient(var(--ok),var(--ok)) top/100% 3px no-repeat,var(--panel)}
pre.report{white-space:pre-wrap;font:.8rem/1.6 var(--f-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;margin:0;max-height:560px;overflow:auto}

/* Checks */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0;padding-bottom:0}
.ctl .q{display:flex;flex-direction:column;gap:7px}
.ctl .ans{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.ctl .side{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.group-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

/* Response actions */
.acts{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.act{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:11px;background:var(--panel);min-width:0;scroll-margin:96px;transition:box-shadow .2s,border-color .2s}
.act:hover{box-shadow:var(--shadow)}
.act.act-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:linear-gradient(var(--ok),var(--ok)) top/100% 3px no-repeat,var(--panel)}
.act.flash{outline:2px solid var(--accent);outline-offset:3px}
.act-top{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--soft);border-radius:9px;padding:3px;align-self:flex-start;max-width:100%}
.tab{font:600 .72rem var(--f-body);padding:5px 9px;border-radius:7px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
pre.cmd{margin:0;font:.76rem/1.55 var(--f-mono);background:#0d1a26;color:#d7e3ec;border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;white-space:pre;max-width:100%}
.act .row{margin-top:auto}

.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:.87rem;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 .8rem var(--f-body);padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:6;padding-block:10px;padding-right:max(14px,env(safe-area-inset-right,0px));gap:10px;flex-direction:row;flex-wrap:wrap;align-items:center}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
  .brand{padding:0} .brand small,.nav-label,.rail-foot{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;width:100%;order:3}
  nav a{white-space:nowrap;padding:7px 10px;font-size:.84rem}
  .top{position:static}
  .top-in,.main-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .main-in{padding-block:20px 64px}
  .ctl{grid-template-columns:1fr}
  .acts{grid-template-columns:1fr}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:1.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Simple sequential layout */
.small{font-size:.8rem}
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.block>h2{display:flex;align-items:center;gap:10px}
.q{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:inline-grid;place-items:center;font:600 .9rem var(--f-display);flex:none}
details.block>summary{list-style:none;display:flex;align-items:center;gap:8px}
details.block>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"›";display:inline-block;font-size:1.3rem;line-height:1;color:var(--muted);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
.sos{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);text-decoration:none;box-shadow:0 6px 20px rgba(217,84,26,.25)}
.sos b{display:block;font:600 1.35rem/1.2 var(--f-display)}
.sos span span{display:block;opacity:.92;font-size:.92rem}
.sos-ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font:700 1.5rem var(--f-display);flex:none}
.sos-go{margin-left:auto;font:600 1rem var(--f-body);white-space:nowrap;background:rgba(255,255,255,.18);padding:8px 14px;border-radius:99px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.li-main{display:flex;flex-direction:column;gap:2px;flex:1 1 240px;min-width:0;text-decoration:none;color:inherit}
.li-main .muted{font-size:.82rem}
.linkish{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.linkish:hover b,a.li-main:hover b{color:var(--accent)}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:78ch}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font:inherit;color:inherit}
.choice b{display:block;font-weight:600;font-size:.97rem}
.choice .muted{font-size:.8rem}
.choice:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 60%,var(--line));flex:none;display:grid;place-items:center}
.choice[aria-checked="true"] .radio{border-color:var(--accent)}
.choice[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.explain{background:var(--panel-2);border-radius:10px;padding:14px 16px;font-size:.93rem;max-width:84ch}
.signs{margin-top:8px}.signs ul{margin:4px 0 0;padding-left:20px}
.steps-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.record{display:flex;align-items:center;gap:10px 14px;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--warn-bg);font-size:.9rem}
.record.on{background:var(--ok-bg)}
.record select{width:auto}
.guide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gstep{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line);position:relative}
.gstep:last-child{border-bottom:0}
.gnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 1rem var(--f-display);background:var(--soft);color:var(--muted)}
.gstep.is-current .gnum{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.gstep.is-done .gnum{background:var(--ok);color:#fff}
.gtitle{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;font:600 1.08rem/1.3 var(--f-body);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gstep.is-done .gtitle span:first-child{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 45%,transparent)}
.gstep:not(.is-current):not(.is-done) .gtitle{color:color-mix(in srgb,var(--ink) 75%,var(--muted))}
.gwho{font-size:.8rem;color:var(--muted);margin-top:2px}
.gdetail{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.gdetail>p{margin:0;font-size:1rem;line-height:1.6;max-width:72ch}
.gstep.is-current{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);margin:0 -22px;padding-left:22px;padding-right:22px;border-radius:0}
.gref{font:.72rem var(--f-mono);color:var(--faint)}
.btn.big{padding:12px 22px;font-size:1rem;border-radius:10px}
.msgbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);max-width:640px}
pre.msg{margin:0;white-space:pre-wrap;font:.86rem/1.55 var(--f-mono);background:var(--panel-2);padding:10px 12px;border-radius:8px}
details.it{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;max-width:760px;background:var(--panel)}
details.it[open]{display:flex}
details.it>summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--info)}
details.it>*+*{margin-top:10px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.done-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:6px 0 6px 14px;position:relative;font-size:.9rem}
.timeline li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.timeline .mono{color:var(--muted);font-size:.8rem}
.report-form{display:flex;flex-direction:column;gap:20px}
.sticky-save{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow);z-index:3;align-self:flex-start}
.qlist{list-style:none;margin:0;padding:0}
.qitem{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:12px 24px;padding:16px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0;padding-bottom:0}
.qtext{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qtext b{font-weight:500;font-size:.97rem;line-height:1.45}
.answer{display:flex;flex-direction:column;gap:8px}
.seg.ans{display:grid;grid-template-columns:repeat(4,1fr)}
.seg.ans button{justify-content:center;padding:8px 4px}
.seg.ans button.a-ok[aria-checked="true"]{background:var(--ok);color:#fff}
.seg.ans button.a-part[aria-checked="true"]{background:var(--warn);color:#fff}
.seg.ans button.a-no[aria-checked="true"]{background:var(--bad);color:#fff}
.seg.ans button.a-na[aria-checked="true"]{background:var(--muted);color:var(--panel)}
.nav-sos{color:#fff!important;opacity:1!important}
.nav-sos svg{stroke:var(--accent)!important}
@media (max-width:860px){
  .qitem{grid-template-columns:1fr}
  .block{padding:16px}
  .gstep.is-current{margin:0 -16px;padding-left:16px;padding-right:16px}
  .timeline li{grid-template-columns:1fr;gap:0}
  .sos{flex-wrap:wrap}.sos-go{margin-left:0}
}

.rlist{list-style:none;margin:0;padding:0}
.ritem{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px 14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:0;padding-bottom:0}
.rdot{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--ok)}
.r-due .rdot{background:var(--warn)} .r-over .rdot{background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.rtitle{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:600 1rem/1.35 var(--f-body);color:var(--ink)}
.r-ok .rtitle{color:color-mix(in srgb,var(--ink) 70%,var(--muted));font-weight:500}
.rmeta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-top:5px}
.rdetail{display:flex;flex-direction:column;gap:10px;margin-top:10px;max-width:72ch}
.rdetail p{margin:0}
.rbtn{align-self:start;white-space:nowrap}
@media (max-width:860px){.ritem{grid-template-columns:14px minmax(0,1fr)}.rbtn{grid-column:2;justify-self:start}}

.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.photo-btn{cursor:pointer}
input[type="file"]:focus-visible+*{outline:2px solid var(--accent)}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{margin:0;position:relative;width:84px}
.ph-img{display:block;width:84px;height:64px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--soft)}
.ph-img img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{font:.66rem var(--f-mono);color:var(--faint);margin-top:2px}
.ph-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;line-height:1;font-size:14px;box-shadow:var(--shadow)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,12,18,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:82vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.eqlist>li{display:block}
.eq-head{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(90px,.7fr) minmax(100px,.7fr) auto;gap:10px 18px;align-items:center}
.eq-actions{grid-column:1/-1}
.eq-sw{display:flex;flex-direction:column;gap:3px;min-width:0}
.eq-sw b{font-size:.88rem;overflow-wrap:anywhere}
.eqf{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
@media (max-width:860px){.eq-head{grid-template-columns:1fr 1fr}.eq-head .li-main{grid-column:1/-1}}

.howbox{background:var(--panel-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.howbox ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.howlink{padding:3px 8px}
.netwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:8px}
.netsvg{display:block;min-width:720px;width:100%;height:auto}
.nz rect{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.nz .zbar{stroke:none}
.nz.k-ot .zbar{fill:var(--accent)}.nz.k-it .zbar{fill:var(--info)}.nz.k-crew .zbar{fill:var(--muted)}.nz.k-dmz .zbar{fill:var(--ok)}.nz.k-remote .zbar{fill:var(--warn)}.nz.k-edge .zbar{fill:var(--ink)}
.nz.k-ext rect{fill:var(--soft);stroke:var(--faint);stroke-dasharray:5 4}
.nz .zt{font:600 13px var(--f-body);fill:var(--ink)}
.nz .ze{font:12px var(--f-body);fill:var(--muted)}
.nl path{fill:none;stroke-width:2.4}
.nl.s-ok path{stroke:var(--ok)}.nl.s-warn path,.nl.s-info path{stroke:var(--warn)}.nl.s-bad path{stroke:var(--bad);stroke-dasharray:7 5}.nl.s-unknown path{stroke:var(--faint);stroke-dasharray:3 4}
.nl.p-off path{stroke:var(--faint);stroke-dasharray:2 6}
.nb{cursor:pointer}
.nb rect{stroke-width:1.2}
.nb text{font:600 11px var(--f-mono)}
.nb.s-ok rect{fill:var(--ok-bg);stroke:var(--ok)}.nb.s-ok text{fill:var(--ok)}
.nb.s-warn rect,.nb.s-info rect{fill:var(--warn-bg);stroke:var(--warn)}.nb.s-warn text,.nb.s-info text{fill:var(--warn)}
.nb.s-bad rect{fill:var(--bad-bg);stroke:var(--bad)}.nb.s-bad text{fill:var(--bad)}
.nb.s-unknown rect{fill:var(--panel);stroke:var(--faint)}.nb.s-unknown text{fill:var(--muted)}
.nb text.nh{font:600 10.5px var(--f-body)}
.nb:focus{outline:none}.nb:focus-visible rect{stroke-width:3}
.nlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted)}
.nlegend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.lg.k-ot{background:var(--accent)}.lg.k-it{background:var(--info)}.lg.k-crew{background:var(--muted)}.lg.k-dmz{background:var(--ok)}.lg.k-remote{background:var(--warn)}.lg.k-edge{background:var(--ink)}.lg.k-ext{background:var(--faint)}
.ll{display:inline-block;width:22px;height:0;border-top:3px solid}
.ll.s-ok{border-color:var(--ok)}.ll.s-warn{border-color:var(--warn)}.ll.s-bad{border-color:var(--bad);border-top-style:dashed}.ll.s-unknown{border-color:var(--faint);border-top-style:dotted}
.neted{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.neted .list>li{gap:10px}
.flashrow{background:var(--accent-soft);border-radius:8px;padding-left:8px!important;padding-right:8px!important}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec p{margin:6px 0 4px;max-width:74ch}
.rec .rdot{background:var(--ok)}.rec-bad .rdot{background:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}.rec-warn .rdot{background:var(--warn)}.rec-info .rdot,.rec-unknown .rdot{background:var(--info)}
</style>

/* ================== PDF OUTPUT ================== */
function playbookPDF(){
  const J=window.jspdf&&window.jspdf.jsPDF; if(!J) throw new Error("PDF tool did not load");
  const s=curShip(), e=EQUIP[ui.eq], sc=SCEN[ui.sc];
  const G=buildGuide(s,ui.eq,ui.sc,ui.marsec); const {done}=guideState(s);
  const doc=new J({unit:"mm",format:"a4"});
  doc.addFileToVFS("dvc.ttf",PDF_FONT_R);doc.addFont("dvc.ttf","DV","normal");
  doc.addFileToVFS("dvcb.ttf",PDF_FONT_B);doc.addFont("dvcb.ttf","DV","bold");
  doc.addFileToVFS("dvm.ttf",PDF_FONT_M);doc.addFont("dvm.ttf","DVM","normal");
  const W=210,H=297,M=16,CW=W-2*M; let y=0;
  const font=(st,sz,c=[17,28,38])=>{doc.setFont("DV",st);doc.setFontSize(sz);doc.setTextColor(...c)};
  const need=h=>{if(y+h>H-18){doc.addPage();y=M+4}};
  const nowISO=new Date().toISOString();
  doc.setFillColor(15,34,51);doc.rect(0,0,W,36,"F");doc.setFillColor(217,84,26);doc.rect(0,36,W,1.4,"F");
  font("bold",8,[223,232,239]);doc.text("PRUVA CYBER · EMERGENCY GUIDE",M,11);
  font("bold",17,[255,255,255]);doc.text(doc.splitTextToSize(sc.plain,CW),M,20);
  font("normal",9,[223,232,239]);doc.text(`${sc.label}  ·  ${s.name}  ·  IMO ${s.imo||"-"}  ·  ${e.label}  ·  Security level ${ui.marsec}`,M,31);
  y=46;
  font("bold",10);doc.text("What is this?",M,y);y+=5;
  font("normal",9.5,[60,72,82]);let L=doc.splitTextToSize(sc.what,CW);doc.text(L,M,y);y+=L.length*4.4+3;
  font("bold",10);doc.text("How you notice it",M,y);y+=5;font("normal",9.5,[60,72,82]);
  sc.signs.forEach(x=>{const l=doc.splitTextToSize("•  "+x,CW-4);need(l.length*4.4);doc.text(l,M+2,y);y+=l.length*4.4+.6});
  y+=4;doc.setDrawColor(227,232,236);doc.line(M,y,W-M,y);y+=8;
  font("bold",13);doc.text("Do these steps in order",M,y);y+=8;
  G.forEach((x,i)=>{
    font("bold",10.5);const tl=doc.splitTextToSize(x.t,CW-22);
    font("normal",9.3);const hl=doc.splitTextToSize(x.h,CW-16);
    let cl=[];const a=x.act&&ACT[x.act];const extra=a&&(a.msg||a.cmd)?actText(x.act,s):"";
    if(extra){doc.setFont("DVM","normal");doc.setFontSize(7.6);cl=extra.split("\n").flatMap(l=>doc.splitTextToSize(l,CW-20))}
    const h=tl.length*4.8+hl.length*4.3+8+(cl.length?cl.length*3.4+9:0);need(Math.min(h,120));
    const d=done[x.id];
    if(d){doc.setFillColor(27,122,75)}else if(x.key){doc.setFillColor(217,84,26)}else{doc.setFillColor(15,34,51)}
    doc.circle(M+4,y-1.4,4,"F");doc.setDrawColor(95,108,120);doc.setLineWidth(.3);doc.rect(W-M-4,y-4.2,4,4);if(d){doc.setDrawColor(27,122,75);doc.setLineWidth(.6);doc.line(W-M-3.3,y-2.3,W-M-2.3,y-1);doc.line(W-M-2.3,y-1,W-M-.6,y-3.6)}font("bold",9,[255,255,255]);doc.text(String(i+1),M+4,y,{align:"center"});
    font("bold",10.5);doc.text(tl,M+12,y);y+=tl.length*4.8;
    font("normal",9.3,[60,72,82]);doc.text(hl,M+12,y);y+=hl.length*4.3+.8;
    font("normal",7.8,[95,108,120]);doc.text(`Who: ${x.who}   ·   Rule: ${x.ref}${d?`   ·   Done ${hhmm(d.at||d)}`:""}`,M+12,y);y+=4;
    if(cl.length){need(cl.length*3.4+9);font("bold",7.5,[95,108,120]);doc.text(a.msg?"MESSAGE":"FOR IT SUPPORT",M+12,y+1);y+=3;
      doc.setFillColor(237,241,244);doc.rect(M+12,y-.5,CW-12,cl.length*3.4+3.5,"F");doc.setFont("DVM","normal");doc.setFontSize(7.6);doc.setTextColor(17,28,38);doc.text(cl,M+14,y+2.6);y+=cl.length*3.4+4.5}
    y+=5;
  });
  need(40);y+=2;doc.setDrawColor(227,232,236);doc.line(M,y,W-M,y);y+=8;
  font("bold",10);doc.text("Signatures",M,y);y+=8;
  ["Officer / SSO","Master","Company Security Officer"].forEach((c,i)=>{const x=M+i*CW/3;font("normal",8,[95,108,120]);doc.text(c,x,y);doc.line(x,y+13,x+CW/3-6,y+13);doc.text("Name, signature, time (UTC)",x,y+17)});
  const tot=doc.getNumberOfPages();
  for(let i=1;i<=tot;i++){doc.setPage(i);font("normal",7.5,[95,108,120]);doc.text(`${s.name} · ${sc.label}`,M,H-9);doc.text(`Page ${i} of ${tot}`,W-M,H-9,{align:"right"});doc.text(`Printed ${fmtUTC(nowISO)}`,W/2,H-9,{align:"center"})}
  return doc;
}
async function savePlaybookPDF(btn){
  const s=curShip();
  btn.disabled=true;const old=btn.textContent;btn.textContent="Preparing PDF…";
  try{const doc=playbookPDF();await saveBlob(`emergency_guide_${fileSafe(s.name)}_${ui.sc}.pdf`,doc.output("blob"))}
  catch(e){toast("Couldn't make the PDF: "+(e.message||e.code))}
  finally{btn.disabled=false;btn.textContent=old}
}

/* ================== GUIDE BUILDER ================== */
function buildGuide(ship, eqKey, scKey, marsec){
  const e = EQUIP[eqKey]||EQUIP.unknown, s = SCEN[scKey]; const eu = ship && ship.eu;
  const G=[]; const add=(id,o)=>G.push({id,...o});
  if(marsec>=2) add("marsec",{t:`Security level ${marsec}: be ready to work without computers`,h:"Be ready to change from the main system to the backup and from screens to paper. Switch off remote service connections.",who:"Master",side:"Ship",ref:"EMSA 3.2.4"});
  const ot=e.cat==="OT"||eqKey==="unknown";
  if(ot) add("safe",{t:"Keep the ship safe first",h:e.manual,who:"Master / Chief Engineer",side:"Ship",ref:"UR E26 Respond — local, independent and/or manual operation"});
  add("tell",{t:"Tell the Master and call the company",h:"Call the company security officer (CSO) by telephone. Do not rely on e-mail — it may be affected.",who:"Officer of the watch",side:"Ship",ref:"MSC-FAL.1/Circ.3/Rev.4 3.5.5; CISA: declare incident"});
  s.steps.forEach((x,i)=>add(scKey+"_"+i,{t:x.t,h:x.h,who:x.who,side:x.it?"IT support":"Ship",act:x.act,it:!!x.it,key:!!x.key,ref:x.it?"CISA Containment; NIST RS.MI":"CISA Containment"}));
  if(!ot) add("safe",{t:"Keep essential work going",h:e.manual,who:"Master",side:"Ship",ref:"UR E26 Respond — local, independent and/or manual operation"});
  if(eqKey!=="unknown"){
    add("isolate",{t:`Separate the ${e.label} from the network`,h:e.isolate,who:"ETO / SSO",side:"Ship",ref:"UR E26 Respond — network isolation"});
    add("mrc",{t:"Put the system in a safe condition",h:e.mrc,who:"Master",side:"Ship",ref:"UR E26 Respond — fallback to a minimal risk condition"});
  }
  add("note",{t:"Write down what happened",h:"Write times in UTC, what you saw, what you did and who did it. Keep photos, USB sticks and any unknown devices. Fill in the incident report in this app.",who:"SSO",side:"Ship",ref:"CISA: collect and preserve data; NIST RS.AN"});
  add("report",{t:"Company reports to the authorities",h:eu?"The company tells the authority named in the Ship Security Plan. Under EU rules (NIS2), if the incident is serious: first warning within 24 hours, full notification within 72 hours, final report within one month.":"The company tells the authority named in the Ship Security Plan, within the time the flag State requires.",who:"Company (CSO)",side:"Company",ref:eu?"EMSA 3.2.5; NIS2 Art. 23":"EMSA 3.2.5; MSC-FAL 3.5.5.1"});
  if(e.cat==="OT") add("class",{t:"Inform the classification society",h:"If approved ship equipment was affected, the company informs the class society.",who:"Company (DPA)",side:"Company",ref:"UR E26; class rules"});
  add("recover",{t:"Bring systems back — only with the company",h:[e.rec,...s.recover].join(" "),who:"Chief Engineer + IT support",side:"Ship + company",ref:"UR E26 Recover; MSC-FAL 3.5.6"});
  add("normal",{t:"Decide to return to normal",h:"The Master and the CSO decide together that it is safe to return to normal operations. Write the time in the log.",who:"Master + CSO",side:"Ship + company",ref:"NIST RC.RP-06"});
  add("learn",{t:"Learn from it",h:"The company finds the cause and updates procedures. Practise this situation at the next security drill.",who:"Company (DPA) + SSO",side:"Company",ref:"MSC-FAL 3.5.6.3; EMSA 3.2.6"});
  return G;
}

function fillCmd(t,ship){
  const p=ui.params||{};
  return t.replace(/\{([A-Z_]+)\}/g,(m,k)=>{
    if(k==="SHIP")return ship?.name||"<SHIP>"; if(k==="IMO")return ship?.imo||"<IMO>";
    if(k==="UTC")return new Date().toISOString().slice(0,16).replace("T"," ")+" UTC";
    return (p[k]||"").trim()||`<${k}>`;
  });
}
function actPlats(a){return a.cmd?Object.keys(a.cmd):[]}
function actPlat(id){const a=ACT[id];const ps=actPlats(a);const sel=(ui.plat||{})[id];return ps.includes(sel)?sel:ps[0]}
function actText(id,ship){const a=ACT[id];if(a.cmd)return fillCmd(a.cmd[actPlat(id)],ship);if(a.msg)return fillCmd(a.msg,ship);return ""}
function paramsOf(id){const a=ACT[id];const used=new Set();[...Object.values(a.cmd||{}),a.msg||""].forEach(t=>(t.match(/\{([A-Z_]+)\}/g)||[]).forEach(m=>used.add(m.slice(1,-1))));return Object.keys(PARAMS).filter(k=>used.has(k))}

/* ================== HOW TO DO EACH ROUTINE CHECK ================== */
const HOWTO={
  d_gps:{how:["Look at the GPS position on the ECDIS or on the GPS receiver.","Take a radar range and bearing of a fixed object (a point of land, a lighthouse, a buoy), or take a visual bearing.","Plot that position on the chart or ECDIS.","Compare the two positions. They should agree within normal accuracy — in coastal waters usually less than 0.1 NM.","In open sea with no land in range: compare the two GPS receivers, check that speed and course make sense, and that AIS targets sit on their radar echoes.","Write in the log book: \"GPS checked – OK\" with the time (UTC)."],
    bad:"If the positions do not agree, do not trust the GPS.",guide:"gnss"},
  d_usb:{how:["Walk past the computers on the bridge, in the engine control room and in the cargo control room.","Look at the USB ports at the front and the back of each computer.","Only allowed items should be plugged in: keyboard, mouse and approved licence dongles.","Check that the USB port locks are still in place."],
    bad:"Take a photo first. Remove the unknown stick, put it in an envelope and write the time and place on it. Never plug it into another computer to see what is on it. Tell the SSO."},
  d_alarm:{how:["ECDIS: open the alarm list. Look for unusual alarms — chart errors, sensor lost, licence errors.","Engine alarm system: look for alarms nobody can explain, values that jump, or alarms that switched off by themselves.","Loading computer: check that ship constants and tank values look normal.","Ask the previous watch if they saw anything strange."],
    bad:"Write it down with the time. Tell the Master or the Chief Engineer. If a system acts by itself, follow the emergency guide.",guide:"config"},
  d_backup:{how:["Open the backup program on the office computer (often an icon next to the clock, bottom right).","Look at the last backup: the date should be last night and the result \"completed\" or \"successful\".","If an external backup disk is used, check it was changed or unplugged as the procedure says."],
    bad:"Start the backup again by hand. If it fails again, tell the SSO and company IT the same day."},
  w_av:{how:["On each office computer, open the antivirus program (on Windows: Start → Windows Security).","Check that it says \"protection is up to date\" and that the last scan is less than a week old.","Open Windows Update and check there are no \"update failed\" messages.","Write down any computer that is not up to date."],
    bad:"Connect the computer to the network so it can update. If it still fails, tell company IT and do not use it for e-mail until it is fixed."},
  w_cab:{how:["Open the network cabinets (bridge, engine control room, office, server room).","Compare with the network diagram or the photo of the cabinet: same devices, about the same number of cables.","Look for unknown small boxes, extra Wi-Fi routers, or loose cables.","Look for one cable with both ends plugged into the same switch — this jams the whole network.","Lights blinking very fast on all ports at once is a warning sign.","Take a photo, then close and lock the cabinet."],
    bad:"Take a photo. Do not unplug an unknown device unless it is clearly causing trouble — tell the ETO and SSO, and company IT decides."},
  w_remote:{how:["Find the remote access box (VPN router) or the remote support program on the computers.","Check that it is switched OFF or disconnected when no service job is planned.","On the computers, check that no remote support window or icon is active.","Check the remote access log: each session written with date, company name and the Master's permission."],
    bad:"Switch it off and ask who left it on. If someone connected without permission, follow the emergency guide.",guide:"mitm"},
  w_mail:{how:["At the weekly safety meeting, or with a note on the notice board, remind the crew:","Do not open unexpected attachments or links — even from names you know.","Check the sender's address carefully, letter by letter.","Never give passwords by e-mail or phone, even if the message looks like it is from the company.","Report strange e-mails to the SSO. Do not delete them.","Write the reminder in the meeting minutes."]},
  m_accounts:{how:["Make a list of the crew who signed off this month.","Send the list to company IT, or remove the accounts yourself if you are allowed to.","Change shared passwords they knew: Wi-Fi, ECDIS user, office computer.","Check that new crew have their own personal login."],
    bad:"If the account of someone who left was used after they left, tell company IT immediately."},
  m_restore:{how:["Open the backup program.","Choose one file from last week, for example a noon report.","Restore it to a different folder — never over the original file.","Open the restored file. It should open normally.","Write the date, the file name and the result."],
    bad:"Tell company IT. If you cannot get files back now, you will not get them back after an attack."},
  m_inventory:{how:["Open Ships & equipment in this app.","Walk through the bridge, engine control room, cargo control room and office.","Add any new or replaced computer or device; remove what is gone.","For every software update done this month, press Record update and write the new version.","Check that the network diagram is still correct."]},
  m_logs:{how:["Ask the ETO or company IT to log in to the firewall.","Check that logs are being recorded and the latest entry is from today.","Check that the log storage is not full.","Write the result."],
    bad:"Company IT must fix it. Without logs nobody can find out what happened after an incident."},
  m_talk:{how:["Choose one topic: USB sticks, passwords, strange e-mails, GPS problems, or what to do with ransomware.","Open the emergency guide in this app and use its steps.","Talk for 5 minutes. Ask each crew member one question.","Write the topic and who attended in the minutes."]},
  y_training:{how:["The company sends the training (online or on board).","Each crew member completes it and gets a certificate.","Bridge and engine users also do training for their own systems (ECDIS, alarm system).","Keep the certificates on board.","New crew complete it in their first month on board."]},
  y_drill:{how:["Choose a situation from the emergency guide, for example ransomware on the office computer or GPS jamming.","Tell everyone it is a drill.","Follow the steps in the guide. At sea, do not really disconnect critical systems — act it out.","Time how long each step takes.","Afterwards talk about what went well and what to change.","Write the drill in the log book and drill records."]},
  y_manual:{how:["Plan it with the Master — in safe waters or in port.","Change engine control from the bridge to the engine control room, then to local control.","Run the engine and steer by hand for a while.","Start and synchronise one generator by hand.","Write the times and any problems."],

  y_ssa:{how:["The company reviews the Ship Security Assessment for cyber risks.","It reviews this year's incidents from this app.","It updates the incident plan and this checklist.","It reviews the network diagram and its firewall and proxy recommendations.","It sends the updated documents to the ship."]}

const dayStr=d=>{const x=new Date(d);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const todayStr=()=>dayStr(new Date());
function addPeriod(ds,f){const d=new Date(ds+"T12:00:00");if(f==="daily")d.setDate(d.getDate()+1);else if(f==="weekly")d.setDate(d.getDate()+7);else if(f==="monthly")d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1);return dayStr(d)}
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
function taskStatus(shipId,task){
  const rec=((state.routine[shipId]||{}).last||{})[task.id];const today=todayStr();
  if(!rec)return {st:"due",label:"Never done",due:today,last:null,left:0};
  const last=dayStr(rec.at);const due=addPeriod(last,task.f);const left=daysBetween(today,due);
  if(left<0)return {st:"over",label:`Overdue by ${-left} day${left===-1?"":"s"}`,due,last:rec,left};
  if(left<=FREQ[task.f].win)return {st:"due",label:left===0?"Due today":`Due in ${left} day${left===1?"":"s"}`,due,last:rec,left};
  return {st:"ok",label:task.f==="daily"?"Done today":`Next in ${left} days`,due,last:rec,left};
}
function routineSummary(shipId){const r={over:0,due:0,ok:0};ROUTINE.forEach(t=>r[taskStatus(shipId,t).st]++);return r}
function vRoutine(){

  const s=state.ships.find(x=>x.id===ui.rtShip)||state.ships[0];ui.rtShip=s.id;
  const sum=routineSummary(s.id);const ff=ui.rtFreq||"all";
  const order={over:0,due:1,ok:2};

  const html=groups.map(f=>{let ts=ROUTINE.filter(t=>t.f===f).map(t=>({t,s:taskStatus(s.id,t)}));
    if(ff==="todo")ts=ts.filter(x=>x.s.st!=="ok");if(!ts.length)return"";ts.sort((a,b)=>order[a.s.st]-order[b.s.st]);
    return `<section class="block"><h2>${FREQ[f].label}</h2><ol class="rlist">${ts.map(({t,s:st})=>{const op=ui.rtOpen[t.id];const hist=((state.routine[s.id]||{}).hist||{})[t.id]||[];
      return `<li class="ritem r-${st.st}"><span class="rdot" aria-hidden="true"></span>
        <div class="rmain"><button type="button" class="rtitle" data-rtopen="${t.id}" aria-expanded="${!!op}">${esc(t.t)}</button>
          <div class="rmeta"><span class="pill ${st.st==="over"?"bad":st.st==="due"?"warn":"ok"}">${st.label}</span><span class="muted small">${esc(t.who)}</span>${st.last?`<span class="muted small">Last: ${st.last.at.slice(0,10)} · ${byLabel(st.last.by)}</span>`:""}<span class="muted small">Due: ${st.due}</span><button type="button" class="btn small ghost howlink" data-rtopen="${t.id}">${op?"Hide":"How to do it ›"}</button></div>
          ${op?`<div class="rdetail"><p>${esc(t.h)}</p>${(()=>{const H=HOWTO[t.id];if(!H)return"";return `<div class="howbox"><div class="eyebrow">How to do it</div><ol>${H.how.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${H.bad?`<div class="notice warn small"><b>If something is wrong:</b> ${esc(H.bad)}${H.guide&&SCEN[H.guide]?` <a href="#playbook" data-guide="${H.guide}">Open the emergency guide</a>`:""}</div>`:""}</div>`})()}<label class="f">Note (optional)<input id="rn_${t.id}" placeholder="e.g. all OK / found unknown USB on ECR PC" value="${esc((ui.rtNote||{})[t.id]||"")}" data-rtnote="${t.id}"></label>
            <div class="row">${photoInput("rp_"+t.id,"data-rtphoto",t.id)}<span class="muted small">The photo is saved with the next "Mark done".</span></div>${photoStrip(ui.rtPhoto[t.id],"data-rtphdel-"+t.id)}<div class="gref">Rule: ${esc(t.ref)}</div>
            ${hist.length?`<div><div class="eyebrow">History</div><ol class="done-list">${hist.slice(-8).reverse().map(h=>`<li><span class="mono muted">${h.at.slice(0,16).replace("T"," ")}</span> ${byLabel(h.by)}${h.note?" — "+esc(h.note):""}${photoStrip(h.photos)}</li>`).join("")}</ol></div>`:""}</div>`:""}
        </div>
        <button class="btn ${st.st==="ok"?"ghost":"primary"} rbtn" data-rtdone="${t.id}" ${st.st==="ok"&&t.f==="daily"?"disabled":""}>${st.st==="ok"?"Done again":"Mark done"}</button></li>`}).join("")}</ol></section>`}).join("");
  return `<div class="head"><div><h1>Routine checks</h1><p>Small checks that keep the ship's computers safe. Do each one when it is due and press <b>Mark done</b>. Red means overdue, yellow means due now.</p></div></div>
    <section class="block"><div class="row" style="justify-content:space-between;align-items:flex-end;gap:14px">
      <label class="f" style="min-width:220px">Ship<select id="rt_ship">${state.ships.map(x=>`<option value="${x.id}" ${x.id===s.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>

      <div class="chips">${[["todo","To do now"],["all","All"],...Object.entries(FREQ).map(([k,v])=>[k,v.label])].map(([k,v])=>`<button type="button" class="chip" aria-pressed="${ff===k}" data-rtf="${k}">${v}</button>`).join("")}</div></section>

function routineText(shipId){
  const s=state.ships.find(x=>x.id===shipId);const sum=routineSummary(shipId);
  let t=`ROUTINE CYBER CHECKS — ${s.name} (IMO ${s.imo||"-"})\nDate: ${todayStr()}\nOverdue ${sum.over} · Due now ${sum.due} · Up to date ${sum.ok}\n`;
  Object.keys(FREQ).forEach(f=>{t+=`\n== ${FREQ[f].label.toUpperCase()} ==\n`;ROUTINE.filter(x=>x.f===f).forEach(x=>{const st=taskStatus(shipId,x);t+=`[${st.label}] ${x.t}\n   Who: ${x.who} · Last: ${st.last?st.last.at.slice(0,10):"never"} · Due: ${st.due} · Rule: ${x.ref}\n`+(HOWTO[x.id]?HOWTO[x.id].how.map((s,i)=>`   ${i+1}. ${s}\n`).join(""):"")})});
  return t;
}
async function markRoutine(shipId,taskId){
  const cur=state.routine[shipId]||{ship:shipId,last:{},hist:{}};const now=new Date().toISOString();
  const noteEl=document.getElementById("rn_"+taskId);const note=noteEl?noteEl.value.trim():"";
  const photos=ui.rtPhoto[taskId]||[];const entry={at:now,by:role,note};if(photos.length)entry.photos=photos;
  const last={...(cur.last||{}),[taskId]:entry};const hist={...(cur.hist||{})};hist[taskId]=[...(hist[taskId]||[]),entry].slice(-30);
  ui.rtPhoto[taskId]=[];if(ui.rtNote)delete ui.rtNote[taskId];
  await put("routine",shipId,{ship:shipId,last,hist});toast("Marked done");
}
function bindRoutine(){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));

  const sh=$("#rt_ship");sh&&sh.addEventListener("change",e=>{ui.rtShip=e.target.value;keepUI();render()});

  on("[data-rtphoto]","change",async e=>{const id=e.target.dataset.rtphoto;const f=e.target.files[0];if(!f)return;toast("Adding photo…");
    try{const p=await makePhoto(f);ui.rtPhoto[id]=[...(ui.rtPhoto[id]||[]),p].slice(0,MAX_PHOTOS);render()}catch(err){photoError(err)}});
  ROUTINE.forEach(t=>on(`[data-rtphdel-${t.id}]`,"click",e=>{const i=+e.currentTarget.getAttribute("data-rtphdel-"+t.id);const ph=[...(ui.rtPhoto[t.id]||[])];const [g]=ph.splice(i,1);dropAsset(g);ui.rtPhoto[t.id]=ph;render()}));

/* ================== PHOTOS ================== */
let assets=null;
const MAX_PHOTOS=6;
function canAddPhotos(){return !!assets||!window.claude}
function resizeImage(file,max,q){
  return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("Could not read the photo")),"image/jpeg",q)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("This file is not a photo the browser can open"))};img.src=url});
}
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
async function makePhoto(file){
  if(!file||!/^image\//.test(file.type))throw new Error("Choose a photo (JPG or PNG).");
  if(assets){const b=await resizeImage(file,1600,.8);const up=await assets.upload(b,{type:"image/jpeg"});return {id:up.id,at:new Date().toISOString(),by:role}}
  if(!window.claude){const b=await resizeImage(file,1024,.62);return {data:await blobToDataURL(b),at:new Date().toISOString(),by:role}}
  throw new Error("You can't add photos in this view.");
}
const photoSrc=p=>p.id?"/_blob/"+p.id:p.data;
function photoStrip(list,delAttr){
  if(!list||!list.length)return"";
  return `<div class="photos">${list.map((p,i)=>`<figure class="ph"><button type="button" class="ph-img" data-viewphoto="${esc(photoSrc(p))}" aria-label="Open photo"><img src="${esc(photoSrc(p))}" alt="Photo ${i+1}" loading="lazy"></button>${delAttr?`<button type="button" class="ph-del" ${delAttr}="${i}" aria-label="Remove photo">×</button>`:""}<figcaption>${(p.at||"").slice(0,10)}</figcaption></figure>`).join("")}</div>`;
}
function photoInput(id,attr,val){

  return `<label class="btn small photo-btn" for="${id}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add photo</label><input type="file" id="${id}" ${attr}="${esc(val)}" accept="image/*" capture="environment" class="visually-hidden">`;
}
function openPhoto(src){
  const o=document.createElement("div");o.className="lightbox";o.innerHTML=`<img src="${esc(src)}" alt="Photo"><button type="button" class="btn" aria-label="Close">Close</button>`;
  const close=()=>o.remove();o.addEventListener("click",e=>{if(e.target===o||e.target.tagName==="BUTTON")close()});document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  document.body.appendChild(o);o.querySelector("button").focus();
}
async function dropAsset(p){if(p&&p.id&&assets){try{await assets.delete(p.id)}catch(e){}}}
function photoError(e){toast(e.code==="quota_exceeded"?"Photo storage is full. Remove old photos first.":e.code==="too_large"?"The photo is too large.":(e.message||"Couldn't add the photo."))}

/* ================== SOFTWARE & UPDATES ================== */
const ageDays=d=>d?Math.floor((Date.now()-new Date(d+"T12:00:00"))/864e5):null;
function ageBadge(d){const a=ageDays(d);if(a===null)return '<span class="pill">Update date unknown</span>';
  const txt=a<1?"updated today":a<60?`updated ${a} days ago`:a<730?`updated ${Math.round(a/30)} months ago`:`updated ${Math.round(a/365)} years ago`;
  return `<span class="pill ${a>365?"bad":a>180?"warn":"ok"}">${txt}</span>`}
function eqRow(s,e,i){
  const mode=ui.eqEdit&&ui.eqEdit.i===i?ui.eqEdit.mode:null;const ups=e.updates||[];const op=ui.eqOpen[i];
  let form="";
  if(mode==="update")form=`<form class="form eqf" data-equpd="${i}">
      <label class="f">New software version<input id="eu_sw_${i}" class="mono" required placeholder="e.g. 5.4.1" value=""></label>
      <label class="f">Date of update<input id="eu_dt_${i}" type="date" value="${todayStr()}" required></label>
      <label class="f">Who did it<input id="eu_by_${i}" placeholder="e.g. ETO, maker's engineer"></label>
      <label class="f wide">Note<input id="eu_nt_${i}" placeholder="e.g. security update from maker, ENC update"></label>
      <div class="row wide"><button class="btn primary" type="submit">Save update</button><button class="btn ghost" type="button" data-eqcancel>Cancel</button></div></form>`;
  if(mode==="edit")form=`<form class="form eqf" data-eqsave="${i}">
      <label class="f">Name<input id="ee_name_${i}" value="${esc(e.name)}" required></label>
      <label class="f">What kind<select id="ee_type_${i}">${Object.entries(EQUIP).filter(([k])=>k!=="unknown").map(([k,v])=>`<option value="${k}" ${k===e.type?"selected":""}>${v.label}</option>`).join("")}</select></label>
      <label class="f">Maker / model<input id="ee_vendor_${i}" value="${esc(e.vendor||"")}"></label>
      <label class="f">Software version<input id="ee_sw_${i}" class="mono" value="${esc(e.sw||"")}"></label>
      <label class="f">Last updated<input id="ee_upd_${i}" type="date" value="${esc(e.updated||"")}"></label>
      <label class="f">Network<input id="ee_net_${i}" value="${esc(e.net||"")}"></label>
      <label class="chk wide"><input type="checkbox" id="ee_remote_${i}" ${e.remote?"checked":""}> Connects to the internet, or a service company can log in remotely</label>
      <div class="row wide"><button class="btn primary" type="submit">Save</button><button class="btn ghost" type="button" data-eqcancel>Cancel</button><button class="btn ghost" type="button" data-deleq="${i}" style="margin-left:auto">Remove equipment</button></div></form>`;
  return `<li class="eqrow"><div class="eq-head"><div class="li-main"><b>${esc(e.name)}</b><span class="muted">${esc(EQUIP[e.type]?.label||e.type)}${e.vendor?" · "+esc(e.vendor):""}${e.net?" · "+esc(e.net):""}</span></div>
      <div class="eq-sw"><span class="eyebrow">Software</span><b class="mono">${esc(e.sw||"—")}</b></div>
      <div class="eq-sw"><span class="eyebrow">Last update</span><b class="mono">${esc(e.updated||"—")}</b></div>
      <div class="row">${ageBadge(e.updated)}${e.remote?'<span class="pill warn">Internet / remote</span>':""}</div>
      <div class="row eq-actions"><button class="btn small primary" data-equpdopen="${i}">Record update</button><button class="btn small ghost" data-eqeditopen="${i}">Edit</button>${ups.length?`<button class="btn small ghost" data-eqhist="${i}" aria-expanded="${!!op}">History (${ups.length})</button>`:""}</div></div>
    ${form}
    ${op&&ups.length?`<ol class="timeline" style="margin-top:6px">${[...ups].reverse().map(u=>`<li><span class="mono">${esc(u.date)}</span><span><b class="mono">${esc(u.from||"—")} → ${esc(u.to)}</b>${u.who?" · "+esc(u.who):""}${u.note?" · "+esc(u.note):""}</span></li>`).join("")}</ol>`:""}</li>`;
}
function bindEquipment(s){
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));
  const eqs=()=>[...(s.equipment||[])];
  on("[data-equpdopen]","click",e=>{ui.eqEdit={i:+e.currentTarget.dataset.equpdopen,mode:"update"};render();const f=document.getElementById("eu_sw_"+ui.eqEdit.i);f&&f.focus()});
  on("[data-eqeditopen]","click",e=>{ui.eqEdit={i:+e.currentTarget.dataset.eqeditopen,mode:"edit"};render()});
  on("[data-eqcancel]","click",()=>{ui.eqEdit=null;render()});
  on("[data-eqhist]","click",e=>{const i=+e.currentTarget.dataset.eqhist;ui.eqOpen[i]=!ui.eqOpen[i];render()});
  on("[data-equpd]","submit",e=>{e.preventDefault();const i=+e.currentTarget.dataset.equpd;const list=eqs();const q={...list[i]};const v=id=>document.getElementById(id+"_"+i).value.trim();
    const u={date:v("eu_dt"),from:q.sw||"",to:v("eu_sw"),who:v("eu_by"),note:v("eu_nt"),at:new Date().toISOString(),by:role};
    q.updates=[...(q.updates||[]),u].slice(-30);q.sw=u.to;q.updated=u.date;list[i]=q;ui.eqEdit=null;ui.eqOpen[i]=true;put("ships",s.id,{...strip(s),equipment:list});toast("Update recorded")});
  on("[data-eqsave]","submit",e=>{e.preventDefault();const i=+e.currentTarget.dataset.eqsave;const list=eqs();const v=id=>document.getElementById(id+"_"+i);
    list[i]={...list[i],name:v("ee_name").value.trim(),type:v("ee_type").value,vendor:v("ee_vendor").value.trim(),sw:v("ee_sw").value.trim(),updated:v("ee_upd").value,net:v("ee_net").value.trim(),remote:v("ee_remote").checked};
    ui.eqEdit=null;put("ships",s.id,{...strip(s),equipment:list});toast("Saved")});
}

/* ================== NETWORK DIAGRAM ================== */
const ZT={
  internet:{label:"Internet / satellite",tier:0,kind:"ext",desc:"Everything outside the ship"},
  gateway:{label:"Satellite link & router",tier:1,kind:"edge",desc:"VSAT / FBB terminal and the router where all outside traffic enters"},
  office:{label:"Office network",tier:2,kind:"it",desc:"Master's office, e-mail, paperwork"},
  crew:{label:"Crew Wi-Fi",tier:2,kind:"crew",desc:"Crew phones and laptops"},
  dmz:{label:"Update area (DMZ)",tier:2,kind:"dmz",desc:"A separate area where updates and files are checked before they reach ship systems"},
  remote:{label:"Remote access",tier:2,kind:"remote",desc:"VPN box or remote support for makers and service companies"},
  bridge:{label:"Bridge network",tier:3,kind:"ot",desc:"ECDIS, radar, GPS, AIS, GMDSS"},
  engine:{label:"Engine network",tier:3,kind:"ot",desc:"Engine control, alarm system, power management"},
  cargo:{label:"Cargo network",tier:3,kind:"ot",desc:"Loading computer, ballast, cargo control"},
  security:{label:"Security network",tier:3,kind:"ot",desc:"CCTV, door access"}
};
const PROT={
  unknown:{label:"Don't know",short:"?"},
  none:{label:"Direct cable / same network — no protection",short:"NONE"},
  switch:{label:"Separate network on the switch (VLAN) only",short:"VLAN"},
  firewall:{label:"Firewall",short:"FW"},
  fwproxy:{label:"Firewall + proxy server",short:"FW+PX"},
  diode:{label:"One-way link (data diode)",short:"1-WAY"},
  off:{label:"Normally unplugged",short:"OFF"}
};
const EQZONE={ecdis:"bridge",gnss:"bridge",gmdss:"bridge",propulsion:"engine",pms:"engine",ams:"engine",cargo:"cargo",vsat:"gateway",it:"office",crew:"crew",access:"security",remote:"remote"};
const SEVORD={bad:0,warn:1,unknown:2,info:3,ok:4};
function typicalNetwork(){
  const z=t=>({id:t,type:t,name:ZT[t].label});
  return {zones:["internet","gateway","office","crew","bridge","engine","cargo"].map(z),
    links:[["internet","gateway"],["gateway","office"],["gateway","crew"],["office","bridge"],["office","engine"],["office","cargo"]].map(([a,b])=>({a,b,prot:"unknown"}))};
}
function minimalNetwork(){return {zones:[{id:"internet",type:"internet",name:ZT.internet.label},{id:"gateway",type:"gateway",name:ZT.gateway.label}],links:[{a:"internet",b:"gateway",prot:"unknown"}]}}
function zoneOfEq(ship,e){
  const zs=ship.network?.zones||[];
  if(e.zone==="none")return null;
  if(e.zone&&zs.some(z=>z.id===e.zone))return e.zone;
  const want=EQZONE[e.type];const z=zs.find(z=>z.type===want);return z?z.id:null;
}
function analyzeNet(ship){
  const net=ship.network;const out=[];const linkSev={};
  if(!net)return {items:out,linkSev};
  const Z={};net.zones.forEach(z=>Z[z.id]=z);
  const nm=z=>z.name||ZT[z.type].label;
  const add=(sev,title,fix,o={})=>{out.push({sev,title,fix,...o});if(o.link!==undefined&&SEVORD[sev]<SEVORD[linkSev[o.link]??"ok"])linkSev[o.link]=sev};
  net.links.forEach((l,i)=>{
    const A=Z[l.a],B=Z[l.b];if(!A||!B)return;
    const where=`${nm(A)} ↔ ${nm(B)}`;const P=l.prot;
    const isFW=P==="firewall"||P==="fwproxy";const weak=P==="none"||P==="switch";
    const K=[ZT[A.type].kind,ZT[B.type].kind];const has=k=>K.includes(k);const oth=k=>ZT[A.type].kind===k?B:A;
    const R={where,link:i};
    if(P==="unknown"){add("unknown","Find out what protects this connection",`Ask the ETO or company IT what sits between these two networks (firewall, switch only, direct cable) and set it in the editor.`,{...R,ref:"UR E26 Identify — network drawing"});return}
    if(P==="off"){add("ok","Normally unplugged",`Good. Plug it in only when needed, write it in the log, and unplug it again.`,{...R});return}
    if(has("ext")){const o=oth("ext");
      if(ZT[o.type].kind==="edge"){isFW?add("ok","Firewall where the internet enters the ship","Good. Keep its software updated and its password changed from the factory setting.",R)
        :add("bad","Put a firewall where the satellite link enters the ship","All traffic from the internet comes in here. Without a firewall, anyone on the internet can try to reach the ship's computers.",{...R,dev:"firewall",ref:"MSC-FAL 3.5.3.3; EMSA Annex A (network protection)"})}
      else add("bad",`${nm(o)} is connected straight to the internet`,`Connect it through the satellite router and its firewall instead — never directly.`,{...R,dev:"firewall",ref:"UR E26 Protect; MSC-FAL 3.5.3.4"});
      return}
    if(has("edge")){const o=oth("edge");const k=ZT[o.type].kind;
      if(k==="ot"){
        if(P==="diode")add("ok",`One-way link from ${nm(o)}`,"Good: data can go out to shore, nothing can come in.",R);
        else if(!isFW)add("bad",`${nm(o)} is open to the internet without a firewall`,`Put a firewall here. Ship operation systems should never be reachable from the internet. Let chart and software updates come through a proxy server or an update area (DMZ).`,{...R,dev:"firewall",ref:"UR E26 Protect (security zones); MSC-FAL 2.2.2"});
        else if(P==="firewall")add("warn",`Use a proxy server for ${nm(o)} updates`,`The firewall is good. Better still: ${nm(o)} should not talk to the internet itself. Let a proxy server or an update area (DMZ) download charts and updates, check them, and pass them on.`,{...R,dev:"proxy",ref:"UR E26 Protect; EMSA Annex A (update management)"});
        else add("ok",`${nm(o)} reaches the internet only through firewall and proxy`,"Good. Allow only the addresses the maker needs for updates.",R);
        return}
      if(k==="it"){
        if(!isFW)add("bad",`Firewall needed between the office network and the satellite link`,`Office computers receive e-mail and open web pages — the most common way attacks start. A firewall must sit here.`,{...R,dev:"firewall",ref:"MSC-FAL 3.5.3.3"});
        else if(P==="firewall")add("info","Add a proxy server for office web traffic","A proxy server fetches web pages and downloads for the office computers, blocks dangerous sites and checks files for viruses before they reach the computer.",{...R,dev:"proxy",ref:"MSC-FAL 3.5.3.4; NIST PR.IR-01"});
        else add("ok","Office web traffic goes through firewall and proxy","Good. Keep the proxy's block list updated.",R);
        return}
      if(k==="crew"){isFW?add("ok","Crew Wi-Fi has its own firewall rules","Good. Crew devices should reach only the internet — nothing else on board.",R)
        :add("bad","Crew Wi-Fi needs a firewall","Crew phones and laptops are not controlled by the company. A firewall must make sure they can reach only the internet and none of the ship's networks.",{...R,dev:"firewall",ref:"EMSA Annex A (separate networks); MSC-FAL 2.2.2"});return}
      if(k==="remote"){isFW?add("ok","Remote access comes through the firewall","Good. Use two-step login (code on phone), keep it switched off when no service job is planned, and log every session.",R)
        :add("bad","Remote access must come through a firewall","Service companies log in here from the internet. Without a firewall, anyone who finds the address can try to log in.",{...R,dev:"firewall",ref:"MSC-FAL 3.5.3.4; NIS2 Art. 21(2)(j)"});return}
      if(k==="dmz"){isFW?add("ok","Update area sits behind the firewall","Good.",R):add("bad","Put a firewall in front of the update area","The update area is where outside files arrive. It needs a firewall towards the internet.",{...R,dev:"firewall"});return}
    }
    if(has("crew")){const o=oth("crew");
      add(isFW?"warn":"bad",`Crew Wi-Fi is connected to ${nm(o)}`,`Remove this connection. Crew devices should reach only the internet, through their own firewall rules.`,{...R,dev:isFW?null:"firewall",ref:"EMSA Annex A (crew network separated); MSC-FAL 2.2.2"});return}
    if(has("it")&&has("ot")){const o=oth("it");
      if(isFW||P==="diode")add("ok",`Firewall between the office and ${nm(o)}`,"Good. Allow only the traffic that is really needed.",R);
      else add("bad",`Firewall needed between the office network and ${nm(o)}`,`A virus on an office computer could reach ${nm(o)}. Put a firewall here so only the necessary traffic can pass.`,{...R,dev:"firewall",ref:"UR E26 Protect (zone boundaries); EMSA Annex A"});
      return}
    if(has("remote")&&has("ot")){const o=oth("remote");
      if(!isFW)add("bad",`Service companies can reach ${nm(o)} directly`,`Put a firewall here. Better: let them connect to the update area (DMZ) or a separate service computer, not straight into ${nm(o)}.`,{...R,dev:"firewall",ref:"UR E26 Protect; MSC-FAL 3.5.3.4"});
      else add("warn",`Keep remote access to ${nm(o)} unplugged when not used`,`Switch it on only for a planned job with the Master's permission, and write it in the log.`,{...R,ref:"MSC-FAL 3.5.3.4"});
      return}
    if(has("dmz")&&has("ot")){const o=oth("dmz");
      isFW||P==="diode"?add("ok",`Updates reach ${nm(o)} through a firewall`,"Good.",R):add("warn",`Put a firewall between the update area and ${nm(o)}`,"Only checked files should pass, through a firewall.",{...R,dev:"firewall"});return}
    if(K[0]==="ot"&&K[1]==="ot"){
      if(P==="none")add("warn",`Separate ${nm(A)} and ${nm(B)}`,"If one gets a virus, the other gets it too. Separate them at least with a VLAN on the switch — a firewall is better.",{...R,dev:"firewall",ref:"UR E26 Protect (security zones)"});
      else if(P==="switch")add("info",`${nm(A)} and ${nm(B)} are separated on the switch`,"Acceptable. A firewall between them is better if they must exchange data.",{...R,dev:"firewall",ref:"UR E26 Protect"});
      else add("ok",`${nm(A)} and ${nm(B)} are separated by a firewall`,"Good.",R);
      return}
    if(weak)add("warn",`Protect the connection ${where}`,"Put a firewall between these networks, or remove the connection if it is not needed.",{...R,dev:"firewall"});
    else add("ok",`${where} is protected`,"Good.",R);
  });
  const types=net.zones.map(z=>z.type);
  const otZones=net.zones.filter(z=>ZT[z.type].kind==="ot");
  if(otZones.length&&!types.includes("dmz")&&net.links.some(l=>[l.a,l.b].some(id=>ZT[Z[id]?.type]?.kind==="ot")&&[l.a,l.b].some(id=>ZT[Z[id]?.type]?.kind==="edge")))
    add("info","Add an update area (DMZ) with a proxy server","A small separate network next to the firewall where chart updates, software updates and USB files are downloaded and checked first. Ship systems then take updates only from there, never from the internet.",{where:"New network next to the satellite router",dev:"proxy",ref:"UR E26 Protect; EMSA Annex A (update management)"});
  const linked=new Set();net.links.forEach(l=>{if(l.prot!=="off"){linked.add(l.a);linked.add(l.b)}});
  otZones.forEach(z=>{if(!linked.has(z.id))add("ok",`${nm(z)} is not connected to other networks`,"This is the safest set-up. Take updates only from a checked USB stick, with permission.",{where:nm(z)})});
  (ship.equipment||[]).forEach(e=>{
    const zid=zoneOfEq(ship,e);const want=EQZONE[e.type];if(!zid||!want)return;const z=Z[zid];
    if(ZT[want].kind==="ot"&&["it","crew"].includes(ZT[z.type].kind))
      add("bad",`${e.name} is on the ${nm(z)}`,`Move it to the ${ZT[want].label}${types.includes(want)?"":" (add that network first)"} behind a firewall. Ship operation equipment should not share a network with office or crew computers.`,{where:e.name,dev:"firewall",ref:"EMSA Annex A (separate networks); UR E26 Protect"});
  });
  const unplaced=(ship.equipment||[]).filter(e=>!zoneOfEq(ship,e));
  if(unplaced.length)add("info",`${unplaced.length} piece${unplaced.length>1?"s":""} of equipment not on the diagram`,`Choose a network for: ${unplaced.map(e=>e.name).join(", ")}. Use "Where is each piece of equipment?" in the editor.`,{where:"Equipment list"});
  out.sort((x,y)=>SEVORD[x.sev]-SEVORD[y.sev]);
  return {items:out,linkSev};
}
function netCounts(an){const c={bad:0,warn:0,info:0,unknown:0,ok:0};an.items.forEach(i=>c[i.sev]++);return c}
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
function netSVG(ship,an){
  const net=ship.network;const W=960;const rows=[[],[],[],[]];
  net.zones.forEach(z=>rows[ZT[z.type].tier].push(z));
  const eqBy={};(ship.equipment||[]).forEach(e=>{const id=zoneOfEq(ship,e);if(id)(eqBy[id]=eqBy[id]||[]).push(e)});
  const lines=z=>{const n=(eqBy[z.id]||[]).length;return z.type==="internet"?0:Math.min(n,4)+(n>4?1:0)||1};
  const boxH=z=>z.type==="internet"?50:46+lines(z)*16;
  const pos={};let y=20;
  rows.forEach(r=>{if(!r.length)return;const gap=W/r.length;const h=Math.max(...r.map(boxH));
    r.forEach((z,i)=>{const w=Math.min(200,gap-24);pos[z.id]={x:gap*(i+.5),y,w,h:boxH(z)}});y+=h+96});
  const H=y-96+60;
  const sevCls=s=>"s-"+(s||"ok");
  const linksSvg=net.links.map((l,i)=>{const A=pos[l.a],B=pos[l.b];if(!A||!B)return"";
    let d,mx,my;
    if(Math.abs(A.y-B.y)<1){const x1=A.x,x2=B.x,y1=A.y+A.h,y2=B.y+B.h,cy=Math.max(y1,y2)+52;d=`M${x1} ${y1} Q${(x1+x2)/2} ${cy} ${x2} ${y2}`;mx=(x1+x2)/2;my=.25*y1+.5*cy+.25*y2}
    else{const [U,L]=A.y<B.y?[A,B]:[B,A];const x1=U.x,y1=U.y+U.h,x2=L.x,y2=L.y;
      const mid=Object.values(pos).filter(p=>p.y>U.y+1&&p.y<L.y-1);
      const blocked=cx=>mid.some(p=>cx>p.x-p.w/2-14&&cx<p.x+p.w/2+14);
      const straightHits=mid.some(p=>{const t=(p.y+p.h/2-y1)/(y2-y1);const xx=x1+(x2-x1)*t;return xx>p.x-p.w/2-10&&xx<p.x+p.w/2+10});
      if(!mid.length||!straightHits){const dy=(y2-y1)/2;d=`M${x1} ${y1} C${x1} ${y1+dy} ${x2} ${y2-dy} ${x2} ${y2}`;mx=(x1+x2)/2;my=(y1+y2)/2}
      else{const cands=[10,W-10];mid.forEach(p=>{cands.push(p.x-p.w/2-12,p.x+p.w/2+12)});
        const target=(x1+x2)/2;const cx=cands.filter(c=>c>4&&c<W-4&&!blocked(c)).sort((a,b)=>Math.abs(a-target)-Math.abs(b-target))[0]??target;
        const top=Math.min(...mid.map(p=>p.y))-14,bot=Math.max(...mid.map(p=>p.y+p.h))+14;
        d=`M${x1} ${y1} C${x1} ${top} ${cx} ${y1} ${cx} ${top} L${cx} ${bot} C${cx} ${y2} ${x2} ${bot} ${x2} ${y2}`;mx=cx;my=(top+bot)/2}}
    const sev=an.linkSev[i]||(l.prot==="unknown"?"unknown":"ok");const lab=PROT[l.prot].short;const bw=lab.length*7.4+16;
    const rec=an.items.find(it=>it.link===i&&it.dev&&it.sev!=="ok");
    const hint=rec?(rec.dev==="proxy"?"Proxy suggested":rec.sev==="bad"?"Firewall needed":"Firewall better"):"";
    return `<g class="nl ${sevCls(sev)} p-${l.prot}"><path d="${d}"/></g>
      <g class="nb ${sevCls(sev)}" data-netlink="${i}" tabindex="0" role="button" aria-label="${esc(PROT[l.prot].label)}"><rect x="${mx-bw/2}" y="${my-11}" width="${bw}" height="22" rx="11"/><text x="${mx}" y="${my+4}" text-anchor="middle">${lab}</text>
      ${hint?`<text class="nh" x="${mx<90?mx-bw/2:mx>W-90?mx+bw/2:mx}" y="${my+25}" text-anchor="${mx<90?"start":mx>W-90?"end":"middle"}">${hint}</text>`:""}</g>`}).join("");
  const zonesSvg=net.zones.map(z=>{const p=pos[z.id];const k=ZT[z.type].kind;const x=p.x-p.w/2;
    if(z.type==="internet")return `<g class="nz k-ext"><rect x="${x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="25"/><text class="zt" x="${p.x}" y="${p.y+30}" text-anchor="middle">${esc(trunc(z.name||ZT[z.type].label,26))}</text></g>`;

function reportText(i){
  const s=state.ships.find(x=>x.id===i.ship)||{};const dl=deadlines(i);
  const L=(k,v)=>`${k.padEnd(24," ")}: ${v||"-"}\n`;
  const gd=Object.values(i.guideDone||{}).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
  let t=`CYBER INCIDENT REPORT\n${"=".repeat(60)}\n`+L("Report no.",i.id)+L("Title",i.title)+L("Status",isClosed(i)?"Closed":"Open")+L("Printed",fmtUTC(new Date().toISOString()));
  t+=`\n1. SHIP\n`+L("Ship",`${s.name||"-"} (IMO ${s.imo||"-"})`)+L("Flag / type",`${s.flag||"-"} / ${s.type||"-"}`)+L("Position / port",i.position)+L("Security level",i.marsec);
  t+=`\n2. WHAT HAPPENED\n`+L("Type",SCEN[i.scenario]?`${SCEN[i.scenario].label} — ${SCEN[i.scenario].plain}`:"")+L("Equipment",EQUIP[i.eq]?.label)+L("Noticed at",fmtUTC(i.detected))+L("Reported by",i.reporter)+`What was seen:\n  ${i.desc||"-"}\nHow it was noticed:\n  ${i.how||"-"}\n`;
  t+=`\n3. EFFECT\n`+L("Affected",(i.impacts||[]).join(", "))+L("Serious incident",i.significant?"Yes":"No")+L("Looks deliberate",i.malicious?"Yes":"No")+L("May affect other countries",i.crossborder?"Yes":"No");
  t+=`\n4. STEPS DONE (emergency guide)\n`+(gd.length?gd.map(g=>`  ${fmtUTC(g.at)}  ${g.t}${g.by?" ("+byLabel(g.by)+")":""}`).join("\n")+"\n":"  -\n")+`Other actions:\n  ${i.actions||"-"}\n`;
  t+=`\n5. TECHNICAL DETAILS\n`+L("Protocol",i.protocol)+L("Port",i.port)+L("Error message",i.errmsg)+L("Most likely issue",i.issue)+`Suspicious addresses/files:\n  ${(i.iocs||"-").replace(/\n/g,"\n  ")}\n`;
  t+=`\n6. TIME LINE (UTC)\n`+((i.timeline||[]).length?[...i.timeline].sort((a,b)=>(a.at||"").localeCompare(b.at||"")).map(x=>`  ${fmtUTC(x.at)}  ${x.text}`).join("\n")+"\n":"  -\n");
  t+=`\n7. CAUSE AND LESSONS\nCause:\n  ${i.cause||"-"}\nChanges:\n  ${i.lessons||"-"}\n\n8. REPORTS TO AUTHORITIES\n`+L("Authorities informed",i.authority)+dl.map(d=>L(d.name,d.sent?"Sent "+fmtUTC(d.sent):"Not yet (due "+fmtUTC(new Date(d.due).toISOString())+")")).join("");
  t+=`\nBased on: MARSEC Doc. 9209 §3.2.5, MSC-FAL.1/Circ.3/Rev.4 §3.5.5–3.5.6, IACS UR E26${s.eu?", NIS2 (EU) 2022/2555 Art. 23":""}, CISA Incident Response Playbook.\nSignatures: Master ............   SSO ............   CSO ............\n`;
  return t;
}
