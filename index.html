function vChecks(){
  if(!state.ships.length)return `<div class="head"><div><h1>Ship checklist</h1></div></div>`+noShips();
  const s=state.ships.find(x=>x.id===ui.ctlShip)||state.ships[0];ui.ctlShip=s.id;
  const a=(state.checks[s.id]||{}).answers||{};const sc=score(s.id);
  const flt=ui.ctlFilter;
  const show=c=>{const r=a[c.id]||{};if(flt==="open")return !r.status;if(flt==="unver")return r.status&&r.status!=="na"&&!r.verified;if(flt==="no")return r.status==="no"||r.status==="part";return true};
  const groups=[...new Set(CONTROLS.map(c=>c.g))];let n=0;
  const html=groups.map(g=>{const cs=CONTROLS.filter(c=>c.g===g&&show(c));if(!cs.length)return"";
    return `<section class="block"><h2>${g}</h2><ol class="qlist">${cs.map(c=>{n++;const r=a[c.id]||{};
      return `<li class="qitem"><div class="qtext"><b>${esc(c.q)}</b><span class="muted small">Proof: ${esc(c.ev)} · Answered by: ${c.side}</span>
        ${r.req?`<div class="notice small"><b>Note from company:</b> ${esc(r.req)}</div>`:""}
        ${r.verified?'<span class="pill ok">Checked by company</span>':r.returned?'<span class="pill bad">Company asks for more</span>':""}</div>
        <div class="answer"><div class="seg ans" role="radiogroup" aria-label="Answer">${["ok","part","no","na"].map(k=>`<button type="button" role="radio" aria-checked="${r.status===k}" class="a-${k}" data-ans="${c.id}:${k}">${STATUS[k][0]}</button>`).join("")}</div>
          <input id="ce_${c.id}" data-cev="${c.id}" placeholder="What proves it? (document name, short note)" value="${esc(r.ev||"")}">
          <div class="row">${(r.photos||[]).length<MAX_PHOTOS?photoInput("cp_"+c.id,"data-cphoto",c.id):`<span class="muted small">Up to ${MAX_PHOTOS} photos</span>`}${(r.photos||[]).length?`<span class="muted small">${r.photos.length} photo${r.photos.length>1?"s":""}</span>`:""}</div>
          ${photoStrip(r.photos,"data-cphdel-"+c.id)}
          ${role==="company"&&r.status?`<div class="row"><input id="cr_${c.id}" data-creq="${c.id}" placeholder="Note to the ship" value="${esc(r.req||"")}"><button class="btn small" data-cver="${c.id}">${r.verified?"Undo check":"Mark as checked"}</button><button class="btn small ghost" data-cret="${c.id}">Ask for more</button></div>`:""}</div></li>`}).join("")}</ol></section>`}).join("");
  return `<div class="head"><div><h1>Ship checklist</h1><p>${role==="ship"?"Answer each question with Yes, Partly or No, and write what proves it. The company checks your answers.":"The ship answers; you check each answer, sign it off or ask for more."} These are the questions inspectors ask about cyber security.</p></div></div>
    <section class="block"><div class="row" style="justify-content:space-between;align-items:flex-end;gap:16px">
      <div class="row"><label class="f" style="min-width:220px">Ship<select id="ct_ship">${state.ships.map(x=>`<option value="${x.id}" ${x.id===s.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label class="f" style="min-width:200px">Show<select id="ct_flt">${[["all","All questions"],["open","Not answered yet"],["unver","Waiting for company check"],["no","Answered No or Partly"]].map(([k,v])=>`<option value="${k}" ${k===flt?"selected":""}>${v}</option>`).join("")}</select></label></div>
      <div class="row"><span class="pill ok">${sc.ok} yes</span><span class="pill warn">${sc.part} partly</span><span class="pill bad">${sc.no} no</span><span class="pill">${sc.open} not answered</span><button class="btn small ghost" id="ctCopy">Copy summary</button></div></div>
      <div class="progress" style="margin-top:14px"><i style="width:${(CONTROLS.length-sc.open)/CONTROLS.length*100}%"></i></div></section>
    ${html||`<div class="empty">Nothing to show for this filter.</div>`}`;
}
function auditText(shipId){
  const s=state.ships.find(x=>x.id===shipId);const a=(state.checks[shipId]||{}).answers||{};const sc=score(shipId);
  let t=`CYBER SECURITY CHECKLIST — ${s.name} (IMO ${s.imo||"-"})\nDate: ${fmtUTC(new Date().toISOString())}\nYes ${sc.ok} · Partly ${sc.part} · No ${sc.no} · Not answered ${sc.open} · Waiting for company check ${sc.unver}\nBased on: MARSEC Doc. 9209 Annex A, IACS UR E26, MSC-FAL.1/Circ.3/Rev.4\n`;
  [...new Set(CONTROLS.map(c=>c.g))].forEach(g=>{t+=`\n== ${g.toUpperCase()} ==\n`;CONTROLS.filter(c=>c.g===g).forEach(c=>{const r=a[c.id]||{};t+=`[${STATUS[r.status||""][0]}${r.verified?", checked":""}] ${c.q}\n   Proof: ${r.ev||"-"}${(r.photos||[]).length?` (+${r.photos.length} photo${r.photos.length>1?"s":""})`:""}${r.req?` · Company note: ${r.req}`:""} · Rule: ${c.ref}\n`})});
  return t;
}

    $("#ct_flt").addEventListener("change",e=>{ui.ctlFilter=e.target.value;render()});
    const upd=(cid,patch)=>{const cur=state.checks[s.id]||{answers:{}};const a={...(cur.answers||{})};a[cid]={...(a[cid]||{}),...patch,at:new Date().toISOString(),by:role};put("checks",s.id,{answers:a,ship:s.id})};
    on("[data-ans]","click",e=>{const [c,k]=e.currentTarget.dataset.ans.split(":");upd(c,{status:k,verified:false,returned:false})});
    on("[data-cev]","change",e=>upd(e.target.dataset.cev,{ev:e.target.value,verified:false}));
    on("[data-creq]","change",e=>upd(e.target.dataset.creq,{req:e.target.value}));
    on("[data-cver]","click",e=>{const c=e.currentTarget.dataset.cver;const r=(state.checks[s.id]?.answers||{})[c]||{};upd(c,{verified:!r.verified,returned:false});toast(r.verified?"Check removed":"Marked as checked")});
    on("[data-cret]","click",e=>{upd(e.currentTarget.dataset.cret,{verified:false,returned:true});toast("Sent back to the ship")});
    $("#ctCopy").addEventListener("click",()=>copyText(auditText(s.id)));
    on("[data-cphoto]","change",async e=>{const c=e.target.dataset.cphoto;const f=e.target.files[0];if(!f)return;toast("Adding photo…");
      try{const p=await makePhoto(f);const r=(state.checks[s.id]?.answers||{})[c]||{};upd(c,{photos:[...(r.photos||[]),p].slice(0,MAX_PHOTOS),verified:false})}catch(err){photoError(err)}});
    CONTROLS.forEach(c=>on(`[data-cphdel-${c.id}]`,"click",e=>{const i=+e.currentTarget.getAttribute("data-cphdel-"+c.id);const r=(state.checks[s.id]?.answers||{})[c.id]||{};const ph=[...(r.photos||[])];const [gone]=ph.splice(i,1);dropAsset(gone);upd(c.id,{photos:ph})}));
  }
  if(v==="filo"){
    on("[data-selship]","click",e=>{ui.ship=e.currentTarget.dataset.selship;ui.netEdit=false;ui.eqEdit=null;keepUI();render()});
    on("[data-newship]","click",()=>{const id=uid("ship");ui.ship=id;keepUI();put("ships",id,{name:"New ship",imo:"",flag:"",type:"",eu:false,e26:false,equipment:[],created:new Date().toISOString()})});
    const sf=$("#shipForm");if(sf){const s=state.ships.find(x=>x.id===ui.ship)||state.ships[0];
      sf.addEventListener("submit",e=>{e.preventDefault();put("ships",s.id,{...strip(s),name:$("#sh_name").value.trim()||"Unnamed ship",imo:$("#sh_imo").value.trim(),flag:$("#sh_flag").value.trim(),type:$("#sh_type").value.trim(),eu:$("#sh_eu").checked,e26:$("#sh_e26").checked});toast("Saved")});
      on("[data-delship]","click",e=>{const b=e.currentTarget;if(b.dataset.confirm){del("ships",s.id);del("checks",s.id);ui.ship=null;toast("Ship deleted")}else{b.dataset.confirm=1;b.textContent="Tap again to delete";b.classList.add("primary")}});
      $("#eqForm").addEventListener("submit",e=>{e.preventDefault();const eq={name:$("#eq_name").value.trim(),type:$("#eq_type").value,vendor:$("#eq_vendor").value.trim(),sw:$("#eq_sw").value.trim(),net:$("#eq_net").value.trim(),updated:$("#eq_upd").value,remote:$("#eq_remote").checked,updates:$("#eq_sw").value.trim()?[{date:$("#eq_upd").value||todayStr(),from:"",to:$("#eq_sw").value.trim(),who:"",note:"Added to equipment list",at:new Date().toISOString(),by:role}]:[]};
        put("ships",s.id,{...strip(s),equipment:[...(s.equipment||[]),eq]});toast("Added")});
      on("[data-deleq]","click",e=>{const b=e.currentTarget;if(!b.dataset.confirm){b.dataset.confirm=1;b.textContent="Tap again to remove";b.classList.add("primary");return}const i=+b.dataset.deleq;const eqs=[...(s.equipment||[])];eqs.splice(i,1);ui.eqEdit=null;put("ships",s.id,{...strip(s),equipment:eqs})});
      bindEquipment(s);
      bindNet(s);
    }
  }
}
init();
</script>
</body>
</html>
